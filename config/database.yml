default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: root
  password: rootpassword
  host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>

development:
  <<: *default
  database: task_management_development
  host: db   # Docker Compose service name

test:
  <<: *default
  database: task_management_test
  username: root
  password: rootpassword
  host: 127.0.0.1

production:
  primary: &primary_production
    <<: *default
    database: task_management_rails_production
    username: task_management_rails
    password: <%= ENV["TASK_MANAGEMENT_RAILS_DATABASE_PASSWORD"] %>

  cache:
    <<: *primary_production
    database: task_management_rails_production_cache
    migrations_paths: db/cache_migrate

  queue:
    <<: *primary_production
    database: task_management_rails_production_queue
    migrations_paths: db/queue_migrate

  cable:
    <<: *primary_production
    database: task_management_rails_production_cable
    migrations_paths: db/cable_migrate