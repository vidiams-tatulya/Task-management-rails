name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - run: bin/brakeman --no-pager
      - run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: task_management_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev

      - name: Wait for MySQL
        run: sleep 15

      - name: Run Tests
        env:
          RAILS_ENV: test
          DB_HOST: 127.0.0.1
        run: |
          bin/rails db:prepare
          bin/rails test

  system-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: task_management_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev

      - name: Wait for MySQL
        run: sleep 15

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DB_HOST: 127.0.0.1
        run: |
          bin/rails db:prepare
          bin/rails test:system

      - name: Upload screenshots if failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: tmp/screenshots
          if-no-files-found: ignore